<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VPS Archive Lens Settings</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #10b981;
      --error: #ef4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px 0;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    p.subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 24px 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #042f2e;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      color: white;
    }
    .btn-secondary {
      background: #334155;
      color: var(--text);
    }
    .btn-secondary:hover {
      background: #475569;
    }
    #status {
      margin-top: 15px;
      font-size: 0.88rem;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .status-success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: block !important;
    }
    .status-error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: block !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔍 VPS Archive Lens</h1>
    <p class="subtitle">Connect to your personal self-hosted VPS archiver.</p>

    <div class="form-group">
      <label for="vpsUrl">VPS Archiver Endpoint URL</label>
      <input type="text" id="vpsUrl" placeholder="http://YOUR_VPS_IP:8888 or https://archive.yourdomain.com">
      <div class="hint">The base URL where your archiver container/service is running.</div>
    </div>

    <div class="form-group">
      <label for="apiToken">Secret API Token</label>
      <input type="password" id="apiToken" placeholder="Your secret API token">
      <div class="hint">The <code>API_TOKEN</code> configured in your server <code>.env</code> file.</div>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn-primary">Save Settings</button>
      <button id="testBtn" class="btn-secondary">Test Connection</button>
    </div>

    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
